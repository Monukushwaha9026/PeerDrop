<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="60%" stop-color="#218cfb"/>
      <stop offset="100%" stop-color="#47a3ff"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#004799" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- iOS Squircle Base Container -->
  <rect width="512" height="512" rx="116" fill="url(#pdBg)"/>
  
  <!-- Subtle Specular Inner Rim Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="4"/>

  <!-- Iconic Symbol: Two Paired Nodes with Direct P2P Wave & File Drop -->
  <g filter="url(#softGlow)">
    <!-- Device A (Left Peer Node) -->
    <rect x="110" y="196" width="92" height="120" rx="20" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="156" cy="286" r="6" fill="#ffffff"/>

    <!-- Device B (Right Peer Node) -->
    <rect x="310" y="196" width="92" height="120" rx="20" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="356" cy="286" r="6" fill="#ffffff"/>

    <!-- Peer Transfer Beam / Arc connecting them -->
    <path d="M 180 170 C 215 130, 297 130, 332 170" fill="none" stroke="url(#beamGrad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="1 0"/>

    <!-- Central Drop / Packet Icon moving dynamically -->
    <path d="M 256 128 C 256 128, 234 162, 234 180 C 234 192.15, 243.85 202, 256 202 C 268.15 202, 278 192.15, 278 180 C 278 162, 256 128, 256 128 Z" fill="#ffffff"/>
    
    <!-- Dynamic Direct Wave below -->
    <path d="M 175 342 C 215 375, 297 375, 337 342" fill="none" stroke="rgba(255, 255, 255, 0.75)" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
